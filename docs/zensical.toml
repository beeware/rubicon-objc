[project.validation]
omitted_files = "warn"
absolute_links = "relative_to_docs"
anchors = "warn"
unrecognized_links = "warn"

[project.extra]
project_name = "rubicon-objc"
package_name = "rubicon-objc"
formal_name = "Rubicon ObjC"
macos_only = true
min_python_version = "3.11"  # The oldest supported Python version
min_python_version_tag = "311"  # The tag version of the minimum python version
recent_python_version = "3.14"  # The newest Python version known to work on all platforms
docs_python_version = "3.12"  # The version of Python required to build the documentation
contribution_guide_root = "how-to/contribute"
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/beeware", name = "BeeWare on GitHub" },
    { icon = "fontawesome/brands/mastodon", link = "https://fosstodon.org/@beeware", name = "BeeWare on Mastodon" },
    { icon = "fontawesome/brands/discord", link = "https://beeware.org/bee/chat/", name = "BeeWare on Discord" },
]
generator = false

# extra_css:
#  - stylesheets/rubicon.css
[project.theme]
name = "material"
language = "en"
logo = "images/rubicon.png"
favicon = "assets/images/brutus-256.png"
features = [
    "content.tabs.link",
    "toc.follow",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.indexes",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "search.share",
]
custom_dir = "overrides"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
# Python Markdown Extensions
attr_list = {}
# Enables easy em and en dashes.
smarty.smart_quotes = false
toc.permalink = true
toc.title = "On this page"
# PyMdown Extensions
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.blocks.caption = {}
# Enables admonitions.
pymdownx.blocks.admonition.types = [
    "note",
    "abstract",
    "info",
    "tip",
    "success",
    "question",
    "warning",
    "failure",
    "danger",
    "bug",
    "example",
    "quote",
]
# Enables collapsible content.
pymdownx.blocks.details.types = [
    { name = "details-note", class = "note" },
    { name = "details-abstract", class = "abstract" },
    { name = "details-info", class = "info" },
    { name = "details-tip", class = "tip" },
    { name = "details-success", class = "success" },
    { name = "details-question", class = "question" },
    { name = "details-warning", class = "warning" },
    { name = "details-failure", class = "failure" },
    { name = "details-danger", class = "danger" },
    { name = "details-bug", class = "bug" },
    { name = "details-example", class = "example" },
    { name = "details-quote", class = "quote" },
]
# Among other things, enables GitHub shorthand references.
pymdownx.magiclink.provider = "github"
pymdownx.magiclink.user = "beeware"
pymdownx.magiclink.repo = "toga"
pymdownx.magiclink.repo_url_shortener = true
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.normalize_issue_symbols = true
pymdownx.blocks.tab.alternate_style = true
pymdownx.snippets.base_path = ["docs/en"]
pymdownx.snippets.url_download = true
pymdownx.snippets.check_paths = true

[project.plugins.search]

[project.plugins.autorefs]
resolve_closest = true

[project.plugins.macros]

[project.plugins.mkdocstrings]
enable_inventory = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src", "stubs"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"  # Parses docstrings from Sphinx formatting - the `:param` formatting, not parsing rST links
allow_inspection = false  # True includes *more* dunder methods, can be enabled on individual class entries if you want them
show_source = false  # Otherwise, source code is shown collapsed for all
members_order = "alphabetical"  # Orders things based on the source code
annotations_path = "brief"  # Keeps type annotation links more concise
merge_init_into_class = true  # Otherwise, init is displayed separately
separate_signature = true  # Shows the `function(args)` separately from name
show_signature = true  # Displays () or (args) along with the function name in the signature
show_signature_annotations = true  # Includes annotations in signature
show_root_heading = true  # Show heading of object at root, otherwise nothing
docstring_section_style = "spacy"  # Better info layout than the other options
line_length = 80  # Requires ruff, forces longer signatures to be stacked, if signatures aren't used, can be removed
show_symbol_type_toc = true  # This is what they added on place of function() (parens) being displayed in the sidebar ToC
show_symbol_type_heading = true  # Enables type symbols next to object names in content
heading_level = 3  # Default heading level of H3 for class docs.
# Rubicon-specific settings
find_stubs_package = true  # Allows for rendering documentation out of the stubs package
